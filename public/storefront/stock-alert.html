<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Notifications | Brackish Roots</title><link rel="stylesheet" href="brackish-theme.css"></head><body><main class="br-confirmation-card"><h1>Stock Notification</h1><p>Stop the stock notification linked to this email.</p><button id="stop" class="br-button">Stop this notification</button><p id="result" role="status"></p><a href="index.html">Return to the shop</a></main><script src="config.js"></script><script>const stop=document.getElementById('stop'),result=document.getElementById('result'),token=location.hash.slice(1);if(!token){stop.disabled=true;result.textContent='This notification link is incomplete. Open the full unsubscribe link in your stock notification email.';}stop.onclick=async()=>{stop.disabled=true;try{const response=await fetch(API_BASE+'/stock-alerts/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});if(!response.ok)throw new Error('We could not stop this notification. Try the link from your email again or contact Brackish Roots.');result.textContent='This notification has been stopped.';}catch(e){result.textContent=e.message;stop.disabled=false;}};</script><script src="photo-watermarks.js"></script></body></html>
